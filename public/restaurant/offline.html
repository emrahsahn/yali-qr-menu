<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yalı — Çevrimdışı</title>
    <style>
      :root { color-scheme: light; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FDFCFA;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #17140F;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .badge {
        width: 72px; height: 72px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 20px;
        background: #FDFCFA;
        border: 1px solid rgba(185, 138, 74, 0.3);
        box-shadow: 0 8px 24px rgba(185, 138, 74, 0.18);
        font-size: 32px;
      }
      h1 { font-size: 20px; font-weight: 800; letter-spacing: 0.02em; }
      p { font-size: 13px; line-height: 1.6; color: #7A7062; font-weight: 600; }
      button {
        margin-top: 8px;
        padding: 14px 28px;
        border: 0; border-radius: 16px;
        background: #B98A4A; color: #fff;
        font-size: 12px; font-weight: 800;
        letter-spacing: 0.08em; text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(185, 138, 74, 0.3);
      }
      button:hover { background: #A87B3E; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">📡</div>
      <h1>İnternet bağlantısı yok</h1>
      <p>
        Bağlantı sağlandığında menüye tekrar ulaşabilirsiniz.
        Daha önce açtığınız menü sayfaları çevrimdışı da görünür.
      </p>
      <button onclick="location.reload()">Tekrar Dene</button>
    </main>
  </body>
</html>
